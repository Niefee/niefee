          <path d="M250,400 L334,292"/>
          <path d="M392,392 L330,286"/>
          <path d="M392,392 L521,324"/>
          <path d="M330,286 L504,284"/>
          <path d="M500,278 L524,330"/>
          <path d="M524,330 L560,400"/>
          <path d="M330,286 L328,268"/>
