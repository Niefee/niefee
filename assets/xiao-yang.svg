      <!-- 近侧腿 -->
      <g transform="translate(352,290)" stroke="#ffffff" fill="none" stroke-linecap="round">
        <g>
          <animateTransform attributeName="transform" type="rotate" dur="2.2s" repeatCount="indefinite" calcMode="linear"
            values="19.49;28.3;36.29;42.01;44.56;44.08;41.25;36.58;30.3;22.64;14.29;6.75;2.02;1.4;4.79;11.23;19.49"
            keyTimes="0;0.0625;0.125;0.1875;0.25;0.3125;0.375;0.4375;0.5;0.5625;0.625;0.6875;0.75;0.8125;0.875;0.9375;1"/>
          <line x1="0" y1="0" x2="66" y2="0" stroke-width="23"/>
          <circle cx="66" cy="0" r="12.5" fill="#ffffff" stroke="none"/>
          <g transform="translate(66,0)">
            <g>
              <animateTransform attributeName="transform" type="rotate" dur="2.2s" repeatCount="indefinite" calcMode="linear"
                values="69.23;58.79;51.01;47.88;50.48;57.89;68.16;79.5;90.52;99.94;106.48;108.98;106.91;100.72;91.52;80.6;69.23"
                keyTimes="0;0.0625;0.125;0.1875;0.25;0.3125;0.375;0.4375;0.5;0.5625;0.625;0.6875;0.75;0.8125;0.875;0.9375;1"/>
              <line x1="0" y1="0" x2="80" y2="0" stroke-width="20"/>
              <ellipse cx="80" cy="1" rx="10.5" ry="8.5" fill="#4b4652" stroke="none"/>
