          <path d="M378,248 C406,264 440,258 466,252" stroke="#ffffff" stroke-width="16" fill="none" stroke-linecap="round"/>
          <path d="M378,248 C406,264 440,258 466,252" stroke="#eef2f8" stroke-width="16" fill="none" stroke-linecap="round" opacity="0.35"/>
          <rect x="458" y="243" width="21" height="14" rx="7" fill="#4b4652" transform="rotate(-6 468 250)"/>
