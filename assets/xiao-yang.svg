    <path d="M-100,114 q2,-8 5,-11 M-95,114 q0,-7 3,-9"/>
    <path d="M0,116 q2,-9 6,-12 M5,116 q0,-8 3,-10"/>
    <path d="M100,113 q2,-7 5,-10 M105,113 q0,-6 3,-8"/>
    <path d="M200,116 q2,-9 6,-12 M205,116 q0,-8 3,-10"/>
    <path d="M300,114 q2,-8 5,-11 M305,114 q0,-7 3,-9"/>
    <path d="M400,116 q2,-9 6,-12 M405,116 q0,-8 3,-10"/>
    <path d="M500,113 q2,-7 5,-10 M505,113 q0,-6 3,-8"/>
    <path d="M600,116 q2,-9 6,-12 M605,116 q0,-8 3,-10"/>
    <path d="M700,114 q2,-8 5,-11 M705,114 q0,-7 3,-9"/>
