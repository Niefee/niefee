              <circle cx="440.4" cy="199.4" r="1.5" fill="#ffffff"/>
              <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.94;0.96;0.98;1" dur="4.5s" repeatCount="indefinite"/>
