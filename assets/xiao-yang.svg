        <path d="M0,-1.6 L1.7,-12 L-1.7,-12 Z" fill="#dbe7d5"/>
        <path d="M0,-1.6 L1.7,-12 L-1.7,-12 Z" fill="#dbe7d5" transform="rotate(90)"/>
        <path d="M0,-1.6 L1.7,-12 L-1.7,-12 Z" fill="#dbe7d5" transform="rotate(180)"/>
        <path d="M0,-1.6 L1.7,-12 L-1.7,-12 Z" fill="#dbe7d5" transform="rotate(270)"/>
