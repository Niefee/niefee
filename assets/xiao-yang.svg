            <circle cx="258" cy="220" r="34"/>
            <circle cx="242" cy="252" r="24"/>
            <circle cx="272" cy="250" r="32"/>
            <circle cx="306" cy="254" r="34"/>
            <circle cx="340" cy="238" r="30"/>
            <circle cx="346" cy="206" r="32"/>
            <circle cx="356" cy="266" r="26"/>
            <circle cx="386" cy="212" r="28"/>
