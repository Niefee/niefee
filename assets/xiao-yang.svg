<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 120" width="700" height="120" role="img" aria-label="横幅：小羊在左边骑着单车一路向前，车轮飞转、围巾飘动">
  <title>小羊骑单车 · 横幅 700×120</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7dbf8"/>
      <stop offset="0.6" stop-color="#ddf1fd"/>
      <stop offset="1" stop-color="#fdf4e6"/>
    </linearGradient>
    <linearGradient id="groundG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed07f"/>
      <stop offset="1" stop-color="#69b96a"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#ffe9a6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffe9a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadowG">
      <stop offset="0" stop-color="#2f6b3a" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#2f6b3a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="woolG" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.68" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4ebf5"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#5b6b82" flood-opacity="0.18"/>
    </filter>
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="44" ry="28"/>
      <ellipse cx="38" cy="9" rx="32" ry="21"/>
      <ellipse cx="-38" cy="10" rx="26" ry="17"/>
      <rect x="-58" y="6" width="106" height="22" rx="11"/>
    </g>
  </defs>

  <!-- 天空 -->
  <rect width="700" height="120" fill="url(#sky)"/>

  <!-- 太阳 -->
  <circle cx="626" cy="30" r="42" fill="url(#sunGlow)">
    <animate attributeName="r" values="38;46;38" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="626" cy="30" r="17" fill="#ffd76e"/>

  <!-- 云 -->
  <g fill="#ffffff" opacity="0.85">
    <g>
      <animateTransform attributeName="transform" type="translate" values="780,0;-160,0" dur="30s" repeatCount="indefinite"/>
      <g transform="translate(252,24) scale(0.30)"><use href="#cloud"/></g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="780,0;-160,0" dur="46s" begin="-14s" repeatCount="indefinite"/>
      <g transform="translate(430,16) scale(0.22)"><use href="#cloud"/></g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="780,0;-160,0" dur="22s" begin="-5s" repeatCount="indefinite"/>
      <g transform="translate(320,44) scale(0.16)"><use href="#cloud"/></g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="780,0;-160,0" dur="38s" begin="-9s" repeatCount="indefinite"/>
      <g transform="translate(384,58) scale(0.13)"><use href="#cloud" opacity="0.7"/></g>
    </g>
  </g>

  <!-- 小鸟 -->
