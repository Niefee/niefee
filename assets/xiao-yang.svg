            values="26.46;18.34;10.54;4.55;1.93;3.38;8.62;16.83;27.13;38.75;50.84;57.29;52.79;47.16;40.96;34.07;26.46"
            keyTimes="0;0.0625;0.125;0.1875;0.25;0.3125;0.375;0.4375;0.5;0.5625;0.625;0.6875;0.75;0.8125;0.875;0.9375;1"/>
          <line x1="0" y1="0" x2="66" y2="0" stroke-width="22"/>
          <circle cx="66" cy="0" r="12" fill="#e6ecf5" stroke="none"/>
          <g transform="translate(66,0)">
