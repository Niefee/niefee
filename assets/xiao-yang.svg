            <line x1="61.5" y1="44.7" x2="-61.5" y2="-44.7"/>
            <line x1="-61.5" y1="44.7" x2="61.5" y2="-44.7"/>
            <line x1="23.5" y1="72.3" x2="-23.5" y2="-72.3"/>
            <line x1="-23.5" y1="72.3" x2="23.5" y2="-72.3"/>
