    </path>
    <path d="M358,22 q3,-3 6,0 q3,-3 6,0">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-3;0,0" dur="2.6s" begin="-1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 远山 -->
  <path d="M0,96 C60,80 130,84 190,92 C250,100 300,82 360,86 C420,90 470,76 530,86 C590,96 645,82 700,90 L700,120 L0,120 Z" fill="#c9e9b4"/>
  <!-- 近山 -->
  <path d="M0,102 C70,94 140,98 210,102 C280,106 340,94 410,98 C480,102 540,92 610,100 C655,105 680,100 700,102 L700,120 L0,120 Z" fill="#a8d894"/>

  <!-- 远处的树 -->
  <g>
    <ellipse cx="486" cy="90" rx="9" ry="10" fill="#8bbd86"/>
    <rect x="484.6" y="92" width="2.4" height="8" fill="#75a37a"/>
    <ellipse cx="512" cy="94" rx="7" ry="8" fill="#7fb47c"/>
    <rect x="510.6" y="96" width="2.2" height="7" fill="#75a37a"/>
    <ellipse cx="552" cy="88" rx="8" ry="9" fill="#8bbd86"/>
    <rect x="550.6" y="90" width="2.2" height="8" fill="#75a37a"/>
    <ellipse cx="392" cy="97" rx="9" ry="6" fill="#9ccb95"/>
    <ellipse cx="410" cy="99" rx="7" ry="5" fill="#a5d19d"/>
