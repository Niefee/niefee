    <path d="M622,101 L624,78 L629,78 L631,101 Z" fill="#c3d6bd"/>
    <path d="M623.5,78 L626.5,78 L626.2,74 L623.8,74 Z" fill="#aec7a8"/>
    <g transform="translate(626.5,78)">
