            <animateTransform attributeName="transform" type="rotate" values="-8 374 228;8 374 228;-8 374 228" dur="1.3s" repeatCount="indefinite"/>
            <path d="M376,224 C356,232 336,214 314,226 L308,216 C330,202 354,220 374,212 Z" fill="#2fbfb0"/>
            <path d="M376,234 C358,244 340,230 320,240 L314,230 C334,218 356,232 374,226 Z" fill="#26a99c"/>
          </g>
          <path d="M368,220 q20,17 45,7" stroke="#2fbfb0" stroke-width="14" fill="none" stroke-linecap="round"/>
          <path d="M370,221 q18,14 40,7" stroke="#4fd6c9" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.55"/>

          <!-- 头部羊毛 -->
