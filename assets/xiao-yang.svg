  <!-- 前景草丛 -->
  <g stroke="#4f9a4a" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M2,119 q2,-9 6,-12 M9,119 q0,-8 4,-10 M-4,119 q-2,-7 1,-11"/>
    <path d="M156,119 q2,-8 5,-11 M162,119 q0,-7 3,-9"/>
