    </g>
  </g>

  <!-- 地面 -->
  <rect x="0" y="102" width="700" height="18" fill="url(#groundG)"/>
  <rect x="0" y="102" width="700" height="2" fill="#b6e59f" opacity="0.7"/>

  <!-- 草地滚动 -->
  <g stroke="#4f9a4a" stroke-width="2.4" fill="none" stroke-linecap="round">
